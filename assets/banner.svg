<style>
.r{fill:#4cc9f0;font-size:14px;animation:fall linear infinite}@keyframes fall{from{transform:translateY(-378px)}to{transform:translateY(420px)}}
.rays{animation:spin 38s linear infinite, pulse 4s ease-in-out infinite}
