@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.crown{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.orbit{stroke-dasharray:110 890;animation:orbit 4.5s linear infinite}
.orbit2{stroke-dasharray:40 960;animation:orbit 4.5s linear infinite;animation-delay:-2.25s}
@keyframes orbit{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
.codeL{animation:flick 6s ease-in-out infinite}
.codeR{animation:flick 6s ease-in-out infinite;animation-delay:-3s}
@keyframes flick{0%,100%{opacity:.95}45%{opacity:.55}50%{opacity:.9}55%{opacity:.6}}
.cursor{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.spark{animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
